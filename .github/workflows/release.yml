name: release

# Runs only when a v* tag is pushed. Builds linux/amd64 exactly as
# ops/aur/PKGBUILD does (ops/workflows_test.go fails on drift), attests the
# tarball's build provenance, and creates a DRAFT release. Publishing the
# draft is a human click (RELEASING.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          export CGO_ENABLED=0
          go build -trimpath \
            -ldflags "-s -w -X github.com/RidgetopAi/backstory/internal/version.Version=${TAG}" \
            -o bin/backstory \
            ./cmd/backstory
          NAME="backstory-${VER}-linux-amd64"
          mkdir -p "dist/${NAME}"
          install -m755 bin/backstory "dist/${NAME}/backstory"
          install -m644 LICENSE README.md ops/backstory.service "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > SHA256SUMS)
          echo "ASSET=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Create draft release
        run: |
          gh release create "${TAG}" --draft --verify-tag --generate-notes \
            --title "${TAG}" "${ASSET}" dist/SHA256SUMS

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # install-mode goinstall lands the binary in GOPATH/bin, which is on PATH,
      # so `make lint` below runs the same pinned version the action ran.
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2
          install-mode: goinstall

      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # panel-qml-test (invoked by `make check` below) needs qmltestrunner
      # plus the QML modules panel/*.qml and panel/qmltest import (QtQuick,
      # QtQuick.Controls.Basic, QtTest); Quickshell/Quickshell.Io/
      # Quickshell.Wayland/qs.* are covered by panel/qmltest/stubs, not a
      # system package. apt pulls in libqt6gui6 (bundles the offscreen QPA
      # plugin) and the other qml6-module-qtquick-* deps transitively.
      - name: Install Qt 6 QML test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qml6-module-qttest \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - run: make check
        env:
          QT_QPA_PLATFORM: offscreen

# Hyprland windowrules for the Backstory panel (task 93f7c6fd).
# The panel is a regular floating toplevel (Quickshell FloatingWindow), not a
# layer-shell surface, so Hyprland's own move/resize binds (SUPER+drag, resize
# keys) apply. Title `backstory` (Quickshell cannot set a per-window app_id, so the rule matches title) is Panel.qml's `windowTitle`;
# ops/hyprland_windowrule_test.go keeps the two in sync.
# Install: source this file from ~/.config/hypr/hyprland.conf (or copy the lines).
# Syntax: Hyprland >= 0.53 (match:* windowrule form).
windowrule = float on, match:title ^(backstory)$
windowrule = size 380 640, match:title ^(backstory)$
windowrule = move 100%-w-20 60, match:title ^(backstory)$
